name: Sync and publish Screen Log
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '33 10 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: screenlog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persisted rating cache
        uses: actions/cache@v4
        with:
          path: scripts/ratings-cache.json
          key: screenlog-ratings-v1-${{ github.run_id }}
          restore-keys: |
            screenlog-ratings-v1-
      - name: Check whether ratings need recovery
        id: rating-check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('scripts/ratings-cache.json').read_text())
              has_ratings = any(isinstance(v, dict) and (v.get('imdbRating') or v.get('rottenTomatoes')) for v in data.values())
          except (OSError, ValueError):
              has_ratings = False
          print('needed=' + ('false' if has_ratings else 'true'))
          PY
      - name: Download previous known-good ratings
        if: ${{ steps.rating-check.outputs.needed == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          repository: timc1972/screen-log
          run-id: 43067472840
          github-token: ${{ github.token }}
          path: .ratings-bootstrap
      - name: Validate sync code
        run: |
          python -m py_compile scripts/sync_trakt.py scripts/ratings.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
          node --check site/app.js
          node --check site/reviews.js
          node --check site/firebase-config.js
      - name: Diagnose Rotten Tomatoes TV scorecard
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request
          from html.parser import HTMLParser
          class JSONScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = None
                  self.contents = {}
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == 'script' and attributes.get('id') in ('media-scorecard-json', 'media-hero-json'):
                      self.active = attributes['id']
                      self.contents[self.active] = ''
              def handle_data(self, text):
                  if self.active:
                      self.contents[self.active] += text
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.active = None
          for slug in ('breaking_bad', 'the_last_of_us'):
              url = 'https://www.rottentomatoes.com/tv/' + slug
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; ScreenLogPersonalSite/1.0)',
                  'Accept': 'text/html,application/xhtml+xml',
                  'Accept-Language': 'en-US,en;q=0.9'
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      page = response.read(3000000).decode('utf-8', 'replace')
                      print('RT diagnostic URL:', response.geturl())
                  parser = JSONScripts()
                  parser.feed(page)
                  print('RT diagnostic', slug, 'scripts:', list(parser.contents))
                  for identifier, raw in parser.contents.items():
                      try: data = json.loads(raw)
                      except ValueError: continue
                      print('RT diagnostic', identifier, 'top keys:', list(data)[:25])
                      if identifier == 'media-scorecard-json':
                          print('RT diagnostic criticsScore:', data.get('criticsScore'))
                          print('RT diagnostic overlay mediaType:', (data.get('overlay') or {}).get('mediaType'))
                      if identifier == 'media-hero-json':
                          content = data.get('content') or {}
                          print('RT diagnostic hero content keys:', list(content)[:25])
                          print('RT diagnostic hero ratings:', {k: content.get(k) for k in ('criticScore', 'criticsScore', 'tomatometer', 'score')})
              except Exception as exc:
                  print('RT diagnostic exception', slug, type(exc).__name__, str(exc)[:80])
          PY
      - name: Update watch history from Trakt
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_trakt.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
