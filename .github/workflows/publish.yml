name: Sync and publish Screen Log
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '33 10 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: screenlog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persisted rating cache
        uses: actions/cache@v4
        with:
          path: scripts/ratings-cache.json
          key: screenlog-ratings-v1-${{ github.run_id }}
          restore-keys: |
            screenlog-ratings-v1-
      - name: Check whether ratings need recovery
        id: rating-check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('scripts/ratings-cache.json').read_text())
              has_ratings = any(isinstance(v, dict) and (v.get('imdbRating') or v.get('rottenTomatoes')) for v in data.values())
          except (OSError, ValueError):
              has_ratings = False
          print('needed=' + ('false' if has_ratings else 'true'))
          PY
      - name: Download previous known-good ratings
        if: ${{ steps.rating-check.outputs.needed == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          repository: timc1972/screen-log
          run-id: 43067472840
          github-token: ${{ github.token }}
          path: .ratings-bootstrap
      - name: Validate sync code
        run: python -m py_compile scripts/sync_trakt.py scripts/ratings.py
      - name: Update watch history from Trakt
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_trakt.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
